<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Platforms, adapters and the standard job record</title>
  <desc id="d">Each career-site platform has one adapter module in scrapers/. Every adapter returns the same standard JobRecord, which is saved as a Job row. Three platforms are shown as examples.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .site { fill: #fff4e0; stroke: #c98a1b; stroke-width: 1.5; }
      .box { fill: #e8f0fe; stroke: #4a78c8; stroke-width: 1.5; }
      .rec { fill: #e6f4ea; stroke: #2e7d46; stroke-width: 1.5; }
      .t { font-size: 15px; font-weight: 600; fill: #1b1f24; }
      .s { font-size: 12.5px; fill: #3b4350; }
      .h { font-size: 13px; font-weight: 600; fill: #1b1f24; }
      .arrow { stroke: #4a5568; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text class="h" x="30" y="30">Employers, grouped by platform</text>
  <text class="h" x="360" y="30">One adapter per platform</text>
  <text class="h" x="690" y="30">Standard record</text>

  <rect class="site" x="30" y="50" width="250" height="56" rx="8"/>
  <text class="t" x="44" y="73">Platform A</text>
  <text class="s" x="44" y="93">many employers, one adapter</text>
  <rect class="site" x="30" y="122" width="250" height="56" rx="8"/>
  <text class="t" x="44" y="145">Platform B</text>
  <text class="s" x="44" y="165">a JSON API</text>
  <rect class="site" x="30" y="194" width="250" height="56" rx="8"/>
  <text class="t" x="44" y="217">Platform C</text>
  <text class="s" x="44" y="237">an RSS or Atom feed</text>
  <text class="s" x="44" y="282">... and so on (full list: docs/architecture.md)</text>

  <rect class="box" x="360" y="50" width="250" height="56" rx="8"/>
  <text class="t" x="374" y="73">scrapers/platform_a.py</text>
  <text class="s" x="374" y="93">fetch_list, fetch_detail</text>
  <rect class="box" x="360" y="122" width="250" height="56" rx="8"/>
  <text class="t" x="374" y="145">scrapers/platform_b.py</text>
  <text class="s" x="374" y="165">fetch_list, fetch_detail</text>
  <rect class="box" x="360" y="194" width="250" height="56" rx="8"/>
  <text class="t" x="374" y="217">scrapers/platform_c.py</text>
  <text class="s" x="374" y="237">fetch_list, fetch_detail</text>

  <path class="arrow" d="M280,78 H356"/>
  <path class="arrow" d="M280,150 H356"/>
  <path class="arrow" d="M280,222 H356"/>
  <path class="arrow" d="M610,78 H686"/>
  <path class="arrow" d="M610,150 H686"/>
  <path class="arrow" d="M610,222 H686"/>

  <rect class="rec" x="690" y="50" width="250" height="236" rx="8"/>
  <text class="t" x="706" y="76">JobRecord</text>
  <text class="s" x="706" y="96">scrapers/base.py</text>
  <text class="s" x="706" y="126">source_job_id, url, title,</text>
  <text class="s" x="706" y="146">company, location, work_mode,</text>
  <text class="s" x="706" y="166">employment_type, salary_text,</text>
  <text class="s" x="706" y="186">posted_at, description</text>
  <text class="t" x="706" y="226">Saved as a Job row</text>
  <text class="s" x="706" y="246">jobs/models.py, in the database</text>
  <text class="s" x="706" y="266">Same shape for every source</text>
</svg>
