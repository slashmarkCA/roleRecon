<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Filter order in rules/filters.py</title>
  <desc id="d">A job passes through seven checks in order; the first failing check rejects it with a reason. Jobs that pass all checks are scored by counting preferred keywords.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .box { fill: #e8f0fe; stroke: #4a78c8; stroke-width: 1.5; }
      .bad { fill: #fdecea; stroke: #c0392b; stroke-width: 1.5; }
      .good { fill: #e6f4ea; stroke: #2e7d46; stroke-width: 1.5; }
      .t { font-size: 15px; font-weight: 600; fill: #1b1f24; }
      .s { font-size: 12.5px; fill: #3b4350; }
      .h { font-size: 13px; font-weight: 600; fill: #1b1f24; }
      .arrow { stroke: #4a5568; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text class="h" x="40" y="30">Checks run in this order; the first failure wins</text>
  <text class="h" x="560" y="30">Failure: saved as Filtered, with this reason</text>

  <!-- checks -->
  <rect class="box" x="40" y="50" width="430" height="50" rx="8"/>
  <text class="t" x="54" y="72">1. Excluded employer</text>
  <text class="s" x="54" y="91">company (or the employer row) contains a listed term</text>

  <rect class="box" x="40" y="128" width="430" height="50" rx="8"/>
  <text class="t" x="54" y="150">2. Excluded title keyword</text>
  <text class="s" x="54" y="169">the title contains a listed word</text>

  <rect class="box" x="40" y="206" width="430" height="50" rx="8"/>
  <text class="t" x="54" y="228">3. Include keyword in the title</text>
  <text class="s" x="54" y="247">the title must contain one (an empty list allows any title)</text>

  <rect class="box" x="40" y="284" width="430" height="50" rx="8"/>
  <text class="t" x="54" y="306">4. Location accepted</text>
  <text class="s" x="54" y="325">location or work mode contains an accepted place (blank: kept, flagged)</text>

  <rect class="box" x="40" y="362" width="430" height="50" rx="8"/>
  <text class="t" x="54" y="384">5. Excluded employment type</text>
  <text class="s" x="54" y="403">for example Volunteer</text>

  <rect class="box" x="40" y="440" width="430" height="50" rx="8"/>
  <text class="t" x="54" y="462">6. Description exclusions</text>
  <text class="s" x="54" y="481">French, Java, Salesforce ... anywhere in the description</text>

  <rect class="box" x="40" y="518" width="430" height="50" rx="8"/>
  <text class="t" x="54" y="540">7. Work arrangement</text>
  <text class="s" x="54" y="559">remote, hybrid or on-site must be accepted (unclear: kept, flagged)</text>

  <rect class="good" x="40" y="596" width="430" height="50" rx="8"/>
  <text class="t" x="54" y="618">8. Score, then keep</text>
  <text class="s" x="54" y="637">count preferred keywords found in the title and description</text>

  <!-- arrows down -->
  <path class="arrow" d="M255,100 V124"/>
  <path class="arrow" d="M255,178 V202"/>
  <path class="arrow" d="M255,256 V280"/>
  <path class="arrow" d="M255,334 V358"/>
  <path class="arrow" d="M255,412 V436"/>
  <path class="arrow" d="M255,490 V514"/>
  <path class="arrow" d="M255,568 V592"/>

  <!-- failures -->
  <rect class="bad" x="560" y="50" width="220" height="50" rx="8"/>
  <text class="s" x="572" y="80">excluded employer: term</text>
  <rect class="bad" x="560" y="128" width="220" height="50" rx="8"/>
  <text class="s" x="572" y="158">excluded title keyword: term</text>
  <rect class="bad" x="560" y="206" width="220" height="50" rx="8"/>
  <text class="s" x="572" y="236">title has no include keyword</text>
  <rect class="bad" x="560" y="284" width="220" height="50" rx="8"/>
  <text class="s" x="572" y="314">location not accepted: place</text>
  <rect class="bad" x="560" y="362" width="220" height="50" rx="8"/>
  <text class="s" x="572" y="392">excluded employment type: term</text>
  <rect class="bad" x="560" y="440" width="220" height="50" rx="8"/>
  <text class="s" x="572" y="470">description exclusion (group): term</text>
  <rect class="bad" x="560" y="518" width="220" height="50" rx="8"/>
  <text class="s" x="572" y="548">work arrangement not accepted: mode</text>
  <rect class="good" x="560" y="596" width="220" height="50" rx="8"/>
  <text class="s" x="572" y="617">Kept: status New,</text>
  <text class="s" x="572" y="634">with score and flags</text>

  <!-- arrows right -->
  <path class="arrow" d="M470,75 H556"/>
  <path class="arrow" d="M470,153 H556"/>
  <path class="arrow" d="M470,231 H556"/>
  <path class="arrow" d="M470,309 H556"/>
  <path class="arrow" d="M470,387 H556"/>
  <path class="arrow" d="M470,465 H556"/>
  <path class="arrow" d="M470,543 H556"/>
  <path class="arrow" d="M470,621 H556"/>

  <text class="s" x="40" y="676">A rejected job always shows score 0, because scoring is the last step.</text>
  <text class="s" x="40" y="694">Preferred keywords only rank jobs that already passed; they never rescue a rejected one.</text>
</svg>
